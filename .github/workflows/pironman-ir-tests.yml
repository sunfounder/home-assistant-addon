name: Pironman IR checks

on:
  push:
    paths:
      - "pironman-ir-receiver/**"
      - ".github/workflows/pironman-ir-tests.yml"
  pull_request:
    paths:
      - "pironman-ir-receiver/**"
      - ".github/workflows/pironman-ir-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q pironman-ir-receiver
      - name: Run IR unit tests
        run: python -m unittest discover -s pironman-ir-receiver/tests -v
